name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          cd desktop
          pip install -r requirements.txt
          pyinstaller phoneremote.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote-Windows
          path: desktop/dist/PhoneRemote.exe

  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Project
        run: cd ios && xcodegen generate
      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build -project PhoneRemote.xcodeproj -scheme PhoneRemote -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"
      - name: Package IPA
        run: |
          cd ios
          mkdir -p build/ipa/Payload
          cp -r build/Release-iphoneos/PhoneRemote.app build/ipa/Payload/
          cd build/ipa
          zip -qr PhoneRemote.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote-iOS
          path: ios/build/ipa/PhoneRemote.ipa

  release:
    name: Create Release
    needs: [build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoneRemote-Windows
          path: release-assets
          
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoneRemote-iOS
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/PhoneRemote.exe
            release-assets/PhoneRemote.ipa
          generate_release_notes: true
