name: Build iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -project PhoneRemote.xcodeproj \
            -scheme PhoneRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package IPA
        run: |
          cd ios
          mkdir -p build/ipa/Payload
          cp -r build/Release-iphoneos/PhoneRemote.app build/ipa/Payload/
          cd build/ipa
          zip -qr PhoneRemote.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote.ipa
          path: ios/build/ipa/PhoneRemote.ipa
